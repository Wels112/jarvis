<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Планировщик недели</title>
<link rel="icon" href="/favicon.ico">
<style>
  /* Неделя-шаблон, которая повторяется: сетка Пн–Вс, часы слева, события —
     тонированные блоки цвета категории. Тихий фон, цвет — только у дел. */
  :root {
    --ground: #f4f3f0;
    --surface: #ffffff;
    --surface-2: #f8f7f4;
    --ink: #1c1f22;
    --ink-soft: #4a5056;
    --muted: #8a9096;
    --line: #e4e1da;
    --line-strong: #d3cfc6;
    --accent: #2f6fd1;
    --today: #fff6e6;
    --today-ink: #a35a00;
    --now: #d9402b;
    --danger: #b8452f;
    --shadow: 0 1px 2px rgba(20, 24, 28, .06), 0 10px 30px rgba(20, 24, 28, .10);
    --font: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
    --font-display: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
    --hour: 52px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #15181b; --surface: #1c2024; --surface-2: #20252a; --ink: #e8e6e1; --ink-soft: #b9bdc2;
      --muted: #7d848b; --line: #2a3036; --line-strong: #353c43; --accent: #6b9ff0; --today: #2a2418;
      --today-ink: #f0b860; --now: #ff6a52; --danger: #e5775d; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.45);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --ground: #15181b; --surface: #1c2024; --surface-2: #20252a; --ink: #e8e6e1; --ink-soft: #b9bdc2;
    --muted: #7d848b; --line: #2a3036; --line-strong: #353c43; --accent: #6b9ff0; --today: #2a2418;
    --today-ink: #f0b860; --now: #ff6a52; --danger: #e5775d; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.45);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--ground); color: var(--ink); font-family: var(--font); font-size: 14px;
    display: flex; flex-direction: column; overflow: hidden; user-select: none;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- шапка ---------- */
  header {
    display: flex; align-items: center; gap: 16px; padding: 12px 18px; flex-wrap: wrap;
    border-bottom: 1px solid var(--line); background: var(--surface);
  }
  h1 { font-family: var(--font-display); font-size: 20px; font-weight: 650; margin: 0; letter-spacing: -.01em; }
  .sub { color: var(--muted); font-size: 12.5px; margin-top: 1px; }
  .legend { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; min-width: 0; }
  .chip {
    display: inline-flex; align-items: center; gap: 7px; padding: 5px 10px 5px 8px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--surface-2); cursor: pointer; font-size: 12.5px;
    color: var(--ink-soft); transition: opacity .15s;
  }
  .chip .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .chip .h { color: var(--muted); font-variant-numeric: tabular-nums; }
  .chip.off { opacity: .4; }
  .chip.off .dot { background: transparent !important; box-shadow: inset 0 0 0 1.5px var(--muted); }
  .tools { display: flex; gap: 8px; align-items: center; }
  .btn {
    border: 1px solid var(--line-strong); background: var(--surface); border-radius: 8px; padding: 7px 12px;
    cursor: pointer; font-size: 13px; display: inline-flex; gap: 6px; align-items: center;
  }
  .btn:hover { background: var(--surface-2); }
  .btn.primary { background: var(--ink); color: var(--surface); border-color: var(--ink); }
  .btn.primary:hover { opacity: .9; }
  .btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, transparent); }
  .icon-btn { border: none; background: none; padding: 6px; border-radius: 8px; cursor: pointer; color: var(--ink-soft); }
  .icon-btn:hover { background: var(--surface-2); }

  .offline {
    display: none; padding: 8px 18px; background: color-mix(in srgb, var(--danger) 14%, var(--surface));
    color: var(--danger); font-size: 13px; border-bottom: 1px solid var(--line);
  }
  body.disconnected .offline { display: block; }

  /* ---------- сетка недели ---------- */
  .week { flex: 1; display: flex; flex-direction: column; min-height: 0; background: var(--surface); }
  .days-head { display: grid; grid-template-columns: 56px repeat(7, minmax(0, 1fr)); border-bottom: 1px solid var(--line); }
  .day-head { padding: 9px 10px 8px; border-left: 1px solid var(--line); display: flex; align-items: baseline; gap: 8px; min-width: 0; }
  .day-head b { font-family: var(--font-display); font-size: 15px; font-weight: 650; }
  .day-head span { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .day-head .total { margin-left: auto; font-variant-numeric: tabular-nums; }
  .day-head.today { background: var(--today); }
  .day-head.today b, .day-head.today .name { color: var(--today-ink); }

  .scroller { flex: 1; overflow-y: auto; overflow-x: hidden; position: relative; }
  .grid { display: grid; grid-template-columns: 56px repeat(7, minmax(0, 1fr)); position: relative; }
  .hours { position: relative; }
  .hour-label {
    height: var(--hour); position: relative; color: var(--muted); font-size: 11.5px;
    font-variant-numeric: tabular-nums; text-align: right; padding-right: 8px;
  }
  .hour-label span { position: relative; top: -8px; }
  .day-col {
    position: relative; border-left: 1px solid var(--line); cursor: cell;
    background-image:
      linear-gradient(to bottom, var(--line) 1px, transparent 1px),
      linear-gradient(to bottom, transparent calc(var(--hour) / 2), color-mix(in srgb, var(--line) 55%, transparent) calc(var(--hour) / 2), color-mix(in srgb, var(--line) 55%, transparent) calc(var(--hour) / 2 + 1px), transparent calc(var(--hour) / 2 + 1px));
    background-size: 100% var(--hour);
  }
  .day-col.today { background-color: color-mix(in srgb, var(--today) 55%, transparent); }
  .now-line { position: absolute; left: -1px; right: 0; height: 2px; background: var(--now); z-index: 5; pointer-events: none; }
  .now-line::before { content: ""; position: absolute; left: -5px; top: -4px; width: 10px; height: 10px; border-radius: 50%; background: var(--now); }

  .event {
    --c: #6e747a;
    position: absolute; border-radius: 7px; padding: 4px 7px 5px; overflow: hidden; cursor: grab;
    background: color-mix(in srgb, var(--c) 17%, var(--surface));
    border: 1px solid color-mix(in srgb, var(--c) 42%, transparent);
    color: color-mix(in srgb, var(--c) 72%, var(--ink));
    box-shadow: 0 1px 0 rgba(0,0,0,.03); z-index: 2; min-height: 18px;
    transition: box-shadow .12s;
  }
  .event:hover { box-shadow: 0 2px 10px rgba(0,0,0,.10); z-index: 3; }
  .event.dragging { cursor: grabbing; box-shadow: var(--shadow); z-index: 20; opacity: .95; }
  .event .t { font-size: 11px; font-variant-numeric: tabular-nums; opacity: .85; white-space: nowrap; }
  .event .title { font-weight: 650; font-size: 12.5px; line-height: 1.25; color: var(--ink); overflow-wrap: anywhere; }
  .event .notes { font-size: 11.5px; color: var(--ink-soft); line-height: 1.3; margin-top: 2px; white-space: pre-line; overflow: hidden; }
  .event.short { padding-top: 1px; padding-bottom: 1px; display: flex; gap: 6px; align-items: center; }
  .event.short .title { font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .event .bell { position: absolute; top: 4px; right: 6px; font-size: 10px; opacity: .7; }
  .event .resize { position: absolute; left: 0; right: 0; bottom: 0; height: 7px; cursor: ns-resize; }
  .selection {
    position: absolute; left: 3px; right: 3px; border-radius: 7px; z-index: 4; pointer-events: none;
    background: color-mix(in srgb, var(--accent) 16%, transparent); border: 1.5px dashed var(--accent);
    color: var(--accent); font-size: 11.5px; font-weight: 600; padding: 3px 7px; font-variant-numeric: tabular-nums;
  }
  .drag-tip {
    position: fixed; z-index: 50; pointer-events: none; background: var(--ink); color: var(--surface);
    padding: 3px 8px; border-radius: 6px; font-size: 12px; font-variant-numeric: tabular-nums; display: none;
  }
  .hint {
    position: absolute; left: 50%; top: 120px; transform: translateX(-50%); z-index: 6; pointer-events: none;
    background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); border-radius: 12px;
    padding: 16px 20px; color: var(--ink-soft); text-align: center; max-width: 380px; line-height: 1.5;
  }
  .hint b { color: var(--ink); display: block; margin-bottom: 4px; font-size: 15px; }

  /* ---------- окна ---------- */
  .backdrop {
    position: fixed; inset: 0; background: rgba(15, 18, 21, .38); z-index: 60; display: flex;
    align-items: center; justify-content: center; padding: 16px;
  }
  .backdrop[hidden] { display: none; }
  .dialog {
    background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); width: min(520px, 100%);
    max-height: calc(100vh - 32px); overflow: auto; padding: 20px 22px; user-select: text;
  }
  .dialog h2 { margin: 0 0 14px; font-family: var(--font-display); font-size: 18px; font-weight: 650; }
  .field { display: grid; gap: 5px; margin-bottom: 12px; }
  .field label, .label { font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .02em; }
  .row { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 10px; }
  input[type=text], input[type=time], select, textarea {
    font: inherit; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line-strong);
    border-radius: 8px; padding: 8px 10px; width: 100%;
  }
  textarea { resize: vertical; min-height: 84px; line-height: 1.45; }
  #f-title { font-size: 16px; font-weight: 600; }
  .cats, .daypick { display: flex; flex-wrap: wrap; gap: 6px; }
  .cats .chip.sel { border-color: var(--ink-soft); color: var(--ink); background: var(--surface); box-shadow: inset 0 0 0 1px var(--ink-soft); }
  .daypick button {
    width: 38px; height: 32px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--surface-2);
    cursor: pointer; font-size: 12.5px;
  }
  .daypick button.on { background: var(--ink); color: var(--surface); border-color: var(--ink); }
  .daypick button:disabled { opacity: .35; cursor: default; }
  .check { display: flex; gap: 8px; align-items: center; color: var(--ink-soft); font-size: 13px; margin: 2px 0 14px; }
  .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 6px; }
  .actions .spacer { flex: 1; }
  .cat-row { display: grid; grid-template-columns: 36px 1fr auto; gap: 8px; align-items: center; margin-bottom: 8px; }
  .cat-row input[type=color] { width: 36px; height: 34px; padding: 2px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface-2); }

  .menu {
    position: fixed; z-index: 70; background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: var(--shadow); padding: 5px; min-width: 190px;
  }
  .menu[hidden] { display: none; }
  .menu button { display: block; width: 100%; text-align: left; border: none; background: none; padding: 7px 10px; border-radius: 6px; cursor: pointer; }
  .menu button:hover { background: var(--surface-2); }
  .menu .sep { height: 1px; background: var(--line); margin: 4px 2px; }
  .menu .danger { color: var(--danger); }

  .toast {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(20px); opacity: 0; z-index: 80;
    background: var(--ink); color: var(--surface); padding: 9px 14px; border-radius: 10px; font-size: 13px;
    transition: opacity .2s, transform .2s; display: flex; gap: 12px; align-items: center; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%); pointer-events: auto; }
  .toast button { background: none; border: none; color: var(--surface); text-decoration: underline; cursor: pointer; padding: 0; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header>
  <div>
    <h1>Неделя</h1>
    <div class="sub" id="sub">Каждую неделю — одно и то же расписание</div>
  </div>
  <div class="legend" id="legend" aria-label="Категории"></div>
  <div class="tools">
    <button class="btn" id="btn-cats" title="Категории и цвета">Категории</button>
    <button class="btn primary" id="btn-new" title="Новое событие (N)">+ Событие</button>
    <button class="icon-btn" id="btn-theme" title="Светлая / тёмная тема" aria-label="Сменить тему">◐</button>
  </div>
</header>
<div class="offline" id="offline">Нет связи с планировщиком — изменения не сохраняются. Запустите Джарвиса или «планировщик.bat».</div>

<main class="week">
  <div class="days-head" id="days-head"></div>
  <div class="scroller" id="scroller">
    <div class="grid" id="grid"></div>
  </div>
</main>

<div class="drag-tip" id="drag-tip"></div>

<div class="backdrop" id="ev-dialog" hidden>
  <form class="dialog" id="ev-form" autocomplete="off">
    <h2 id="ev-heading">Новое событие</h2>
    <div class="field">
      <label for="f-title">Название</label>
      <input type="text" id="f-title" maxlength="120" placeholder="Например, урок с Петей — алгебра" required>
    </div>
    <div class="field">
      <span class="label">Категория</span>
      <div class="cats" id="f-cats"></div>
    </div>
    <div class="row">
      <div class="field">
        <label for="f-day">День</label>
        <select id="f-day"></select>
      </div>
      <div class="field">
        <label for="f-start">Начало</label>
        <input type="time" id="f-start" step="300" required>
      </div>
      <div class="field">
        <label for="f-end">Конец</label>
        <input type="time" id="f-end" step="300" required>
      </div>
    </div>
    <div class="field">
      <label for="f-notes">Что буду делать</label>
      <textarea id="f-notes" maxlength="2000" placeholder="План, ссылки, что подготовить…"></textarea>
    </div>
    <div class="field">
      <span class="label" id="f-copy-label">Повторить ещё в эти дни</span>
      <div class="daypick" id="f-copy"></div>
    </div>
    <label class="check"><input type="checkbox" id="f-remind"> Джарвис напомнит за 10 минут</label>
    <div class="actions">
      <button type="button" class="btn danger" id="f-delete">Удалить</button>
      <span class="spacer"></span>
      <button type="button" class="btn" id="f-cancel">Отмена</button>
      <button type="submit" class="btn primary" id="f-save">Сохранить</button>
    </div>
  </form>
</div>

<div class="backdrop" id="cat-dialog" hidden>
  <form class="dialog" id="cat-form">
    <h2>Категории</h2>
    <div id="cat-list"></div>
    <button type="button" class="btn" id="cat-add">+ Категория</button>
    <div class="actions">
      <span class="spacer"></span>
      <button type="button" class="btn" id="cat-cancel">Отмена</button>
      <button type="submit" class="btn primary">Сохранить</button>
    </div>
  </form>
</div>

<div class="menu" id="menu" hidden>
  <button type="button" data-act="edit">Изменить</button>
  <button type="button" data-act="dup">Дублировать в другие дни…</button>
  <div class="sep"></div>
  <button type="button" data-act="del" class="danger">Удалить</button>
</div>

<div class="toast" id="toast"><span id="toast-text"></span><button type="button" id="toast-undo">Отменить</button></div>

<script>
"use strict";
const DAYS = ["Понедельник", "Вторник", "Среда", "Четверг", "Пятница", "Суббота", "Воскресенье"];
const SHORT = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"];
const SNAP = 15;                 // минут — шаг перетаскивания
const HOUR = 52;                 // высота часа в пикселях (как --hour)
const PX = HOUR / 60;            // пикселей в минуте

let plan = { version: 0, categories: [], events: [] };
let hidden = new Set(load("hiddenCats", []));
let undoStack = [];
let editing = null;              // событие в окне (null — новое)
let draft = null;                // новое событие из выделения
let menuFor = null;

const $ = (s) => document.querySelector(s);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
function load(key, def) { try { const v = localStorage.getItem("planner." + key); return v ? JSON.parse(v) : def; } catch { return def; } }
function store(key, v) { try { localStorage.setItem("planner." + key, JSON.stringify(v)); } catch { } }

const toMin = (s) => { const [h, m] = s.split(":").map(Number); return h * 60 + m; };
const toHHMM = (m) => { m = Math.max(0, Math.min(1440, Math.round(m))); return String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0"); };
const snap = (m) => Math.round(m / SNAP) * SNAP;
const dur = (mins) => { const h = Math.floor(mins / 60), m = mins % 60; return (h ? h + " ч" : "") + (h && m ? " " : "") + (m ? m + " мин" : (h ? "" : "0 мин")); };
const todayIdx = () => (new Date().getDay() + 6) % 7;
const catOf = (ev) => plan.categories.find((c) => c.id === ev.cat);
const colorOf = (ev) => (catOf(ev) || {}).color || "#6e747a";

// ---------------- связь с файлом через Джарвиса ----------------
async function api(method, url, body) {
  const r = await fetch(url, { method, headers: { "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || ("ошибка " + r.status));
  if (data.version) plan.version = data.version;
  return data.result;
}
async function reload() {
  try {
    plan = await (await fetch("/api/plan", { cache: "no-store" })).json();
    document.body.classList.remove("disconnected");
    render();
  } catch { document.body.classList.add("disconnected"); }
}
// Голосом через Джарвиса могли добавить событие — сверяем номер версии
let busy = 0;
setInterval(async () => {
  try {
    const v = await (await fetch("/api/version", { cache: "no-store" })).json();
    document.body.classList.remove("disconnected");
    if (v.version !== plan.version && !busy && !dragState && $("#ev-dialog").hidden) reload();
  } catch { document.body.classList.add("disconnected"); }
}, 4000);

async function op(fn, undo, message) {
  busy++;
  try {
    const result = await fn();
    if (undo) { undoStack.push(undo); if (undoStack.length > 40) undoStack.shift(); }
    if (message) toast(message, !!undo);
    return result;
  } catch (e) {
    toast("Не сохранилось: " + e.message, false);
    await reload();
  } finally { busy--; }
}

async function createEvent(ev) {
  const made = await op(() => api("POST", "/api/events", ev));
  if (made) { plan.events.push(made); render(); }
  return made;
}
async function patchEvent(id, changes, record = true) {
  const i = plan.events.findIndex((e) => e.id === id);
  if (i < 0) return;
  const before = { ...plan.events[i] };
  plan.events[i] = { ...before, ...changes };
  render();
  // Отмена правки — тоже правка, но её саму в историю не пишем: иначе Ctrl+Z ходил бы по кругу
  const saved = await op(() => api("PATCH", "/api/events/" + id, changes),
    record ? async () => { await patchEvent(id, pick(before, Object.keys(changes)), false); } : null, null);
  if (saved) { const j = plan.events.findIndex((e) => e.id === id); if (j >= 0) plan.events[j] = saved; render(); }
}
async function deleteEvent(id, record = true) {
  const ev = plan.events.find((e) => e.id === id);
  if (!ev) return;
  plan.events = plan.events.filter((e) => e.id !== id);
  render();
  await op(() => api("DELETE", "/api/events/" + id), record ? async () => {
    const copy = { ...ev }; delete copy.id; await createEvent(copy);
  } : null, record ? `Удалено: «${ev.title}»` : null);
}
const pick = (o, keys) => Object.fromEntries(keys.map((k) => [k, o[k]]));

// ---------------- отрисовка ----------------
function renderHead() {
  const head = $("#days-head");
  head.replaceChildren(el("div"));
  const t = todayIdx();
  DAYS.forEach((name, d) => {
    const h = el("div", "day-head" + (d === t ? " today" : ""));
    h.append(el("b", null, SHORT[d]), el("span", "name", name));
    const mins = plan.events.filter((e) => e.day === d && !hidden.has(e.cat || "")).reduce((s, e) => s + toMin(e.end) - toMin(e.start), 0);
    h.append(el("span", "total", mins ? dur(mins) : ""));
    head.append(h);
  });
}

function renderLegend() {
  const box = $("#legend");
  box.replaceChildren();
  const cats = [...plan.categories, { id: "", name: "Без категории", color: "#8a9096" }];
  for (const c of cats) {
    const mins = plan.events.filter((e) => (e.cat || "") === c.id).reduce((s, e) => s + toMin(e.end) - toMin(e.start), 0);
    if (c.id === "" && !mins) continue;
    const chip = el("button", "chip" + (hidden.has(c.id) ? " off" : ""));
    chip.type = "button";
    chip.title = hidden.has(c.id) ? "Показать" : "Скрыть";
    const dot = el("span", "dot"); dot.style.background = c.color;
    chip.append(dot, el("span", null, c.name), el("span", "h", mins ? dur(mins) + " в нед." : ""));
    chip.onclick = () => { hidden.has(c.id) ? hidden.delete(c.id) : hidden.add(c.id); store("hiddenCats", [...hidden]); render(); };
    box.append(chip);
  }
}

// Пересекающиеся события — рядом, а не друг на друге
function lanes(events) {
  const sorted = [...events].sort((a, b) => toMin(a.start) - toMin(b.start) || toMin(b.end) - toMin(a.end));
  const out = new Map();
  let cluster = [], clusterEnd = -1;
  const flush = () => {
    const laneEnds = [];
    for (const ev of cluster) {
      let lane = laneEnds.findIndex((end) => end <= toMin(ev.start));
      if (lane < 0) { lane = laneEnds.length; laneEnds.push(0); }
      laneEnds[lane] = toMin(ev.end);
      out.set(ev.id, { lane });
    }
    for (const ev of cluster) out.get(ev.id).count = laneEnds.length;
    cluster = [];
  };
  for (const ev of sorted) {
    if (cluster.length && toMin(ev.start) >= clusterEnd) flush();
    cluster.push(ev);
    clusterEnd = Math.max(clusterEnd, toMin(ev.end));
  }
  if (cluster.length) flush();
  return out;
}

function eventNode(ev, pos) {
  const n = el("div", "event");
  n.dataset.id = ev.id;
  n.style.setProperty("--c", colorOf(ev));
  const top = toMin(ev.start) * PX, h = Math.max((toMin(ev.end) - toMin(ev.start)) * PX, 18);
  n.style.top = top + "px";
  n.style.height = h - 2 + "px";
  const w = 100 / pos.count;
  n.style.left = `calc(${pos.lane * w}% + 3px)`;
  n.style.width = `calc(${w}% - 6px)`;
  const time = el("div", "t", ev.start + "–" + ev.end);
  const title = el("div", "title", ev.title);
  if (h < 38) { n.classList.add("short"); n.append(title, time); }
  else {
    n.append(time, title);
    if (ev.notes && h > 64) n.append(el("div", "notes", ev.notes));
  }
  if (ev.remind) { const b = el("span", "bell", "🔔"); b.title = "Джарвис напомнит за 10 минут"; n.append(b); }
  n.title = ev.title + (ev.notes ? "\n\n" + ev.notes : "") + "\n" + DAYS[ev.day] + ", " + ev.start + "–" + ev.end;
  n.append(el("div", "resize"));
  return n;
}

function render() {
  renderHead();
  renderLegend();
  const grid = $("#grid");
  grid.replaceChildren();
  const hours = el("div", "hours");
  for (let h = 0; h < 24; h++) { const l = el("div", "hour-label"); l.append(el("span", null, h ? String(h).padStart(2, "0") + ":00" : "")); hours.append(l); }
  grid.append(hours);
  const t = todayIdx();
  for (let d = 0; d < 7; d++) {
    const col = el("div", "day-col" + (d === t ? " today" : ""));
    col.dataset.day = d;
    col.style.height = 24 * HOUR + "px";
    const evs = plan.events.filter((e) => e.day === d && !hidden.has(e.cat || ""));
    const pos = lanes(evs);
    for (const ev of evs) col.append(eventNode(ev, pos.get(ev.id)));
    if (d === t) { const now = el("div", "now-line"); now.id = "now-line"; col.append(now); }
    grid.append(col);
  }
  placeNow();
  const empty = !plan.events.length;
  let hint = $("#hint");
  if (empty && !hint) {
    hint = el("div", "hint"); hint.id = "hint";
    hint.append(el("b", null, "Распишите свою неделю"),
      document.createTextNode("Проведите мышью по пустому месту в нужный день — появится событие. Потом его можно перетаскивать и растягивать за нижний край."));
    $("#scroller").append(hint);
  } else if (!empty && hint) hint.remove();
  $("#sub").textContent = plan.events.length
    ? `${plan.events.length} ${plural(plan.events.length, "событие", "события", "событий")} · повторяется каждую неделю`
    : "Каждую неделю — одно и то же расписание";
}
function plural(n, a, b, c) { n %= 100; if (n > 10 && n < 20) return c; n %= 10; return n === 1 ? a : n >= 2 && n <= 4 ? b : c; }

function placeNow() {
  const line = $("#now-line");
  if (!line) return;
  const d = new Date();
  line.style.top = (d.getHours() * 60 + d.getMinutes()) * PX + "px";
}
setInterval(() => { if (todayIdx() !== Number(($(".day-col.today") || {}).dataset?.day)) render(); else placeNow(); }, 30000);

// ---------------- мышь: создать, перенести, растянуть ----------------
let dragState = null;
const tip = $("#drag-tip");
const scroller = $("#scroller");
function colAt(x) {
  const cols = [...document.querySelectorAll(".day-col")];
  return cols.find((c) => { const r = c.getBoundingClientRect(); return x >= r.left && x < r.right; })
    || (x < cols[0].getBoundingClientRect().left ? cols[0] : cols[cols.length - 1]);
}
// Минуты по высоте колонки на экране, а не по заданному размеру часа: при
// масштабе Windows или окна (125 %, Ctrl+колесо) они расходятся
const minAt = (col, y) => { const r = col.getBoundingClientRect(); return (y - r.top) * 1440 / (r.height || 1440 * PX); };
function showTip(x, y, text) { tip.textContent = text; tip.style.display = "block"; tip.style.left = x + 14 + "px"; tip.style.top = y + 12 + "px"; }
function autoScroll(y) {
  const r = scroller.getBoundingClientRect();
  if (y < r.top + 40) scroller.scrollTop -= 12;
  else if (y > r.bottom - 40) scroller.scrollTop += 12;
}

$("#grid").addEventListener("pointerdown", (e) => {
  if (e.button !== 0) return;
  hideMenu();
  const evNode = e.target.closest(".event");
  const col = e.target.closest(".day-col");
  if (!col) return;
  e.preventDefault();
  if (evNode) {
    const ev = plan.events.find((x) => x.id === evNode.dataset.id);
    const resizing = e.target.classList.contains("resize");
    const r = evNode.getBoundingClientRect();
    dragState = { kind: resizing ? "resize" : "move", ev, node: evNode, x0: e.clientX, y0: e.clientY,
      grabOffset: e.clientY - r.top, moved: false, day: ev.day, start: toMin(ev.start), end: toMin(ev.end) };
  } else {
    const m = snap(Math.floor(minAt(col, e.clientY) / SNAP) * SNAP);
    const sel = el("div", "selection");
    col.append(sel);
    dragState = { kind: "create", col, day: Number(col.dataset.day), a: m, b: m + SNAP, sel, x0: e.clientX, y0: e.clientY };
    drawSelection();
  }
  try { $("#grid").setPointerCapture(e.pointerId); } catch { /* перо или тест без настоящего указателя */ }
});

function drawSelection() {
  const s = dragState, lo = Math.min(s.a, s.b), hi = Math.max(s.a, s.b);
  s.sel.style.top = lo * PX + "px";
  s.sel.style.height = Math.max(hi - lo, SNAP) * PX - 2 + "px";
  s.sel.textContent = toHHMM(lo) + "–" + toHHMM(Math.max(hi, lo + SNAP));
}

$("#grid").addEventListener("pointermove", (e) => {
  const s = dragState;
  if (!s) return;
  if (!s.moved && Math.hypot(e.clientX - s.x0, e.clientY - s.y0) < 4) return;
  s.moved = true;
  autoScroll(e.clientY);
  if (s.kind === "create") {
    const m = snap(minAt(s.col, e.clientY));
    s.b = Math.max(0, Math.min(1440, m));
    drawSelection();
    return;
  }
  const len = s.end - s.start;
  s.node.classList.add("dragging");
  if (s.kind === "resize") {
    const col = s.node.parentElement;
    const end = Math.max(toMin(s.ev.start) + SNAP, Math.min(1440, snap(minAt(col, e.clientY))));
    s.newEnd = end;
    s.node.style.height = (end - toMin(s.ev.start)) * PX - 2 + "px";
    showTip(e.clientX, e.clientY, s.ev.start + "–" + toHHMM(end) + " · " + dur(end - toMin(s.ev.start)));
    return;
  }
  const col = colAt(e.clientX);
  let start = snap(minAt(col, e.clientY - s.grabOffset));
  start = Math.max(0, Math.min(1440 - len, start));
  if (s.node.parentElement !== col) col.append(s.node);
  s.node.style.left = "3px"; s.node.style.width = "calc(100% - 6px)";
  s.node.style.top = start * PX + "px";
  s.newDay = Number(col.dataset.day); s.newStart = start;
  showTip(e.clientX, e.clientY, SHORT[s.newDay] + " " + toHHMM(start) + "–" + toHHMM(start + len));
});

$("#grid").addEventListener("pointerup", (e) => {
  const s = dragState;
  dragState = null;
  tip.style.display = "none";
  if (!s) return;
  if (s.kind === "create") {
    s.sel.remove();
    let lo = Math.min(s.a, s.b), hi = Math.max(s.a, s.b);
    if (!s.moved || hi - lo < SNAP * 2) hi = Math.min(lo + 60, 1440);     // щелчок — час
    openEditor(null, { day: s.day, start: toHHMM(lo), end: toHHMM(hi) });
    return;
  }
  if (!s.moved) { openEditor(s.ev); return; }
  if (s.kind === "resize" && s.newEnd != null && s.newEnd !== s.end) {
    patchEvent(s.ev.id, { end: toHHMM(s.newEnd) });
    toast(`«${s.ev.title}» теперь до ${toHHMM(s.newEnd)}`, true);
  } else if (s.kind === "move" && s.newStart != null && (s.newStart !== s.start || s.newDay !== s.day)) {
    const len = s.end - s.start;
    patchEvent(s.ev.id, { day: s.newDay, start: toHHMM(s.newStart), end: toHHMM(s.newStart + len) });
    toast(`«${s.ev.title}» → ${SHORT[s.newDay]} ${toHHMM(s.newStart)}`, true);
  } else render();
});

// Правая кнопка — быстрые действия
$("#grid").addEventListener("contextmenu", (e) => {
  const n = e.target.closest(".event");
  if (!n) return;
  e.preventDefault();
  menuFor = plan.events.find((x) => x.id === n.dataset.id);
  const m = $("#menu");
  m.hidden = false;
  m.style.left = Math.min(e.clientX, innerWidth - 210) + "px";
  m.style.top = Math.min(e.clientY, innerHeight - 140) + "px";
});
function hideMenu() { $("#menu").hidden = true; }
document.addEventListener("pointerdown", (e) => { if (!e.target.closest("#menu")) hideMenu(); });
$("#menu").addEventListener("click", (e) => {
  const act = e.target.dataset.act;
  const ev = menuFor;
  hideMenu();
  if (!ev) return;
  if (act === "edit") openEditor(ev);
  if (act === "dup") openEditor(null, { ...ev, id: undefined }, true);
  if (act === "del") deleteEvent(ev.id);
});

// ---------------- окно события ----------------
let pickedCat = "", copyDays = new Set();
function openEditor(ev, preset, duplicate) {
  editing = ev;
  const src = ev || preset;
  $("#ev-heading").textContent = ev ? "Событие" : duplicate ? "Копия события" : "Новое событие";
  $("#f-title").value = src.title || "";
  $("#f-notes").value = src.notes || "";
  $("#f-start").value = src.start;
  $("#f-end").value = src.end;
  $("#f-remind").checked = !!src.remind;
  const day = $("#f-day");
  day.replaceChildren(...DAYS.map((n, i) => { const o = el("option", null, n); o.value = i; return o; }));
  day.value = src.day;
  pickedCat = src.cat != null ? src.cat : (load("lastCat", plan.categories[0]?.id || ""));
  drawCats();
  copyDays = new Set();
  $("#f-copy-label").textContent = ev ? "Скопировать ещё в эти дни" : "Повторить ещё в эти дни";
  drawCopy();
  $("#f-delete").hidden = !ev;
  $("#ev-dialog").hidden = false;
  setTimeout(() => $("#f-title").focus(), 0);
}
function drawCats() {
  const box = $("#f-cats");
  box.replaceChildren();
  for (const c of [...plan.categories, { id: "", name: "Без категории", color: "#8a9096" }]) {
    const b = el("button", "chip" + (pickedCat === c.id ? " sel" : ""));
    b.type = "button";
    const dot = el("span", "dot"); dot.style.background = c.color;
    b.append(dot, el("span", null, c.name));
    b.onclick = () => { pickedCat = c.id; drawCats(); };
    box.append(b);
  }
}
function drawCopy() {
  const box = $("#f-copy");
  box.replaceChildren();
  const cur = Number($("#f-day").value);
  SHORT.forEach((n, i) => {
    const b = el("button", copyDays.has(i) ? "on" : "", n);
    b.type = "button";
    b.disabled = i === cur;
    b.onclick = () => { copyDays.has(i) ? copyDays.delete(i) : copyDays.add(i); drawCopy(); };
    box.append(b);
  });
}
$("#f-day").addEventListener("change", () => { copyDays.delete(Number($("#f-day").value)); drawCopy(); });
function closeEditor() { $("#ev-dialog").hidden = true; editing = null; }
$("#f-cancel").onclick = closeEditor;
$("#f-delete").onclick = () => { const ev = editing; closeEditor(); if (ev) deleteEvent(ev.id); };
$("#ev-dialog").addEventListener("pointerdown", (e) => { if (e.target.id === "ev-dialog") closeEditor(); });
$("#ev-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  let start = $("#f-start").value, end = $("#f-end").value;
  if (toMin(end) <= toMin(start)) { $("#f-end").focus(); toast("Конец должен быть позже начала", false); return; }
  const data = { title: $("#f-title").value.trim() || "Без названия", notes: $("#f-notes").value.trim(),
    day: Number($("#f-day").value), start, end, cat: pickedCat, remind: $("#f-remind").checked };
  store("lastCat", pickedCat);
  const ev = editing;
  closeEditor();
  if (ev) {
    const changes = Object.fromEntries(Object.entries(data).filter(([k, v]) => ev[k] !== v));
    if (Object.keys(changes).length) { await patchEvent(ev.id, changes); toast("Сохранено", true); }
  } else {
    const made = await createEvent(data);
    if (made) undoStack.push(async () => { await deleteEvent(made.id, false); });
  }
  for (const d of copyDays) {
    const copy = await createEvent({ ...data, day: d });
    if (copy) undoStack.push(async () => { await deleteEvent(copy.id, false); });
  }
  if (!ev || copyDays.size) toast(copyDays.size ? `Добавлено в ${copyDays.size + (ev ? 0 : 1)} дн.` : "Добавлено", !copyDays.size);
});

// ---------------- категории ----------------
let catDraft = [];
function openCats() {
  catDraft = plan.categories.map((c) => ({ ...c }));
  drawCatList();
  $("#cat-dialog").hidden = false;
}
function drawCatList() {
  const box = $("#cat-list");
  box.replaceChildren();
  catDraft.forEach((c, i) => {
    const row = el("div", "cat-row");
    const color = el("input"); color.type = "color"; color.value = c.color; color.oninput = () => (c.color = color.value);
    const name = el("input"); name.type = "text"; name.value = c.name; name.maxLength = 40; name.oninput = () => (c.name = name.value);
    const del = el("button", "icon-btn", "✕"); del.type = "button"; del.title = "Удалить категорию";
    del.onclick = () => { catDraft.splice(i, 1); drawCatList(); };
    row.append(color, name, del);
    box.append(row);
  });
}
$("#btn-cats").onclick = openCats;
$("#cat-add").onclick = () => { catDraft.push({ name: "Новая", color: "#5b8def" }); drawCatList(); };
$("#cat-cancel").onclick = () => ($("#cat-dialog").hidden = true);
$("#cat-dialog").addEventListener("pointerdown", (e) => { if (e.target.id === "cat-dialog") $("#cat-dialog").hidden = true; });
$("#cat-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("#cat-dialog").hidden = true;
  const cats = await op(() => api("PUT", "/api/categories", { categories: catDraft }), null, "Категории сохранены");
  if (cats) { await reload(); }
});

// ---------------- прочее ----------------
let toastTimer = null;
function toast(text, canUndo) {
  $("#toast-text").textContent = text;
  $("#toast-undo").hidden = !canUndo || !undoStack.length;
  $("#toast").classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $("#toast").classList.remove("show"), canUndo ? 5000 : 2600);
}
async function undo() {
  const fn = undoStack.pop();
  $("#toast").classList.remove("show");
  if (fn) { await fn(); toast("Отменено", false); }
}
$("#toast-undo").onclick = undo;
$("#btn-new").onclick = () => {
  const d = todayIdx(), now = new Date(), start = Math.min(snap(now.getHours() * 60 + 60), 1380);
  openEditor(null, { day: d, start: toHHMM(start), end: toHHMM(start + 60) });
};
$("#btn-theme").onclick = () => {
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  const cur = document.documentElement.dataset.theme || (dark ? "dark" : "light");
  const next = cur === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  store("theme", next);
};
const savedTheme = load("theme", null);
if (savedTheme) document.documentElement.dataset.theme = savedTheme;

document.addEventListener("keydown", (e) => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if (e.key === "Escape") { closeEditor(); $("#cat-dialog").hidden = true; hideMenu(); }
  if (!typing && (e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") { e.preventDefault(); undo(); }
  if (!typing && e.key.toLowerCase() === "n" && $("#ev-dialog").hidden) { e.preventDefault(); $("#btn-new").click(); }
});

reload().then(() => {
  // Сразу к делу: к текущему часу или к утру
  const h = new Date().getHours();
  scroller.scrollTop = Math.max(0, (h >= 7 && h < 22 ? h - 1 : 7)) * HOUR;
});
</script>
</body>
